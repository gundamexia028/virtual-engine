name: Python tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      AUTH_CONTEXT_SIGNING_KEY: "ci-test-only-auth-context-signing-key-not-for-production-0000000000000000"
      SUPABASE_URL: ""
      SUPABASE_KEY: ""
      SUPABASE_ANON_KEY: ""
      SUPABASE_SERVICE_ROLE_KEY: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare ephemeral test configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import secrets

          target = Path(".streamlit/secrets.toml")
          target.parent.mkdir(parents=True, exist_ok=True)
          access_code = secrets.token_urlsafe(24)
          admin_password = secrets.token_urlsafe(32)
          while admin_password == access_code:
              admin_password = secrets.token_urlsafe(32)
          target.write_text(
              f'APP_ACCESS_CODE = "{access_code}"\n'
              f'ADMIN_PASSWORD = "{admin_password}"\n',
              encoding="utf-8",
          )
          PY

      - name: Run all test scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          test_files = sorted(Path("tests").glob("*.py"))
          if not test_files:
              raise SystemExit("No test files found.")

          failed = []
          for test_file in test_files:
              print(f"::group::{test_file}")
              result = subprocess.run([sys.executable, str(test_file)], check=False)
              print("::endgroup::")
              if result.returncode:
                  failed.append(str(test_file))

          if failed:
              raise SystemExit("Failed test scripts: " + ", ".join(failed))
          PY

      - name: Remove ephemeral test files
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          Path(".streamlit/secrets.toml").unlink(missing_ok=True)
          for name in ("__pycache__", ".pytest_cache", ".runtime", "runs", "runs_web"):
              for directory in Path(".").rglob(name):
                  if directory.is_dir():
                      shutil.rmtree(directory, ignore_errors=True)
          for pattern in ("*.pyc", "*.jsonl", "*.log", "*.sqlite", "*.sqlite3", "*.db"):
              for file_path in Path(".").rglob(pattern):
                  if file_path.is_file():
                      file_path.unlink(missing_ok=True)
          PY
