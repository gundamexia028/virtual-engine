name: Virtual-Engine offline-safe acceptance
on:
  workflow_dispatch:
  push:
    branches: [develop, review-deploy]
  pull_request:
    branches: [develop, main, review-deploy]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ""
      SUPABASE_KEY: ""
      SUPABASE_ANON_KEY: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            tests_audit/requirements-test.txt
      - name: Install real runtime and test dependencies
        run: |
          python -m pip install -r app/requirements.txt -r tests_audit/requirements-test.txt
          python -m playwright install --with-deps chromium
          python -m pip freeze > runtime-resolved.txt
      - name: Real-runtime regressions and bounded matrix (no mock opt-in)
        run: python tests_audit/run_regressions.py --out audit_results/regressions --with-matrix --coverage
      - name: Loopback-only real browser acceptance
        run: python tests_audit/real_browser_acceptance.py --out audit_results/browser
      - name: Retain failures and successful evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtual-engine-acceptance-evidence
          path: |
            audit_results/
            runtime-resolved.txt
          if-no-files-found: warn
      # No recursive deletion of *.jsonl: reviewed synthetic demo fixtures stay intact.
      # Test scripts isolate ephemeral credentials/runtime data in temporary paths.
